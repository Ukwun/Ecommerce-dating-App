services:
  - type: web
    name: marketplace-backend
    env: node
    plan: starter
    scaling:
      minInstances: 2
      maxInstances: 10
      targetCPUPercent: 70
      targetMemoryPercent: 75
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_REDIS
        value: "true"
      - key: MONGO_MAX_POOL_SIZE
        value: "30"
      - key: MONGO_MIN_POOL_SIZE
        value: "2"
      - key: MONGO_MAX_CONNECTING
        value: "4"
      - key: GENERAL_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: INSTANCE_MEMORY_BYTES
        value: "536870912"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketplace-redis
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: TEST_MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYMENT_CALLBACK_URL
        value: "marketplace://payment-complete"
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: PASSWORD_RESET_BASE_URL
        sync: false
    # Environment variables must be set in Render dashboard:
    # MONGO_URI, TEST_MONGO_URI (dedicated database name containing "test"), JWT_SECRET, NODE_ENV=production, PORT=8082
    # EMAIL_SERVICE, EMAIL_USERNAME, EMAIL_PASSWORD, EMAIL_FROM
    # ALERT_WEBHOOK_URL (Slack/Teams/custom webhook for critical monitoring alerts)
  - type: worker
    name: marketplace-worker
    env: node
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 5
      targetCPUPercent: 70
      targetMemoryPercent: 75
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketplace-redis
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: MONGO_MAX_POOL_SIZE
        value: "20"
      - key: MONGO_MIN_POOL_SIZE
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
  - type: keyvalue
    name: marketplace-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

