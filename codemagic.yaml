workflows:
  android-build:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 18.17.1
      xcode: latest
      android_sdk: 34
    triggering:
      events:
        - push
        - pull_request
      branch:
        patterns:
          - pattern: main
            include: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build Android APK
        script: eas build --platform android --profile preview --wait
    artifacts:
      - build/outputs/apk/preview/**/*.apk
    publishing:
      email:
        enabled: true
