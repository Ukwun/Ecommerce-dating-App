workflows:
  react-native-android:
    name: React Native Android Build
    instance_type: mac_mini_m2
    environment:
      node: 18
      java: 11
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
