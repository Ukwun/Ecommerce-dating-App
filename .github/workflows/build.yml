name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Validate Expo Token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN secret is missing!"
            echo "Add it in: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: EXPO_TOKEN"
            exit 1
          fi
          echo "✅ EXPO_TOKEN is configured"
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/marketplace_test
          JWT_SECRET: ci-integration-secret-with-sufficient-length
      
      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - name: Build with EAS
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
